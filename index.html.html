<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to ASCII Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Image to ASCII Converter</h1>
    <p class="intro">Upload an image and turn it into ASCII art.</p>

    <section class="controls">
      <label class="upload">
        <span>Choose an image</span>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
      </label>

      <label class="setting">ASCII width
        <input id="width" type="range" min="40" max="180" value="100">
        <output id="widthValue">100</output>
      </label>

      <label class="setting">Character style
        <select id="style">
          <option value="@%#*+=-:. ">Standard</option>
          <option value="$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\\"^`'. ">Detailed</option>
          <option value="#*:. ">Simple</option>
          <option value="█▓▒░ ">Blocks</option>
        </select>
      </label>

      <label class="check"><input id="invert" type="checkbox"> Invert brightness</label>
      <button id="convert" disabled>Convert to ASCII</button>
    </section>

    <p id="message" role="status">Choose a JPG, PNG, or WEBP image to begin.</p>

    <section class="preview-grid">
      <div class="panel">
        <h2>Original image</h2>
        <img id="preview" alt="Selected image preview">
      </div>
      <div class="panel">
        <h2>ASCII output</h2>
        <pre id="output">Your ASCII art will appear here.</pre>
      </div>
    </section>

    <div class="downloads">
      <button id="downloadTxt" disabled>Download TXT</button>
      <button id="downloadPng" disabled>Download ASCII PNG</button>
    </div>
  </main>
  <canvas id="canvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
